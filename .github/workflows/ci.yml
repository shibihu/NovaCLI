name: NovaCLI CI

on:
  push:
    branches: [ main, fix/gpt-oss-tool-protocol ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions.checkout@v4

      - name: Set up Python
        uses: actions.setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q

  integration-test:
    name: Optional Real Groq Integration Test
    runs-on: ubuntu-latest
    if: "${{ secrets.GROQ_API_KEY != '' }}"

    steps:
      - name: Checkout Code
        uses: actions.checkout@v4

      - name: Set up Python
        uses: actions.setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Real Groq Integration Test
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_groq_integration.py -v
