name: NovaCLI CI

on:
  push:
    branches:
      - main
      - Novacli

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # UNIT TESTS
  # ============================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q


  # ============================================================
  # REAL GROQ INTEGRATION TEST
  # ============================================================
  integration-test:
    name: Real Groq Integration Test
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # --------------------------------------------------------
      # Check whether the GitHub Secret exists
      # --------------------------------------------------------
      - name: Check Groq API Key
        id: check-key
        shell: bash
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is not configured."
          fi

      # --------------------------------------------------------
      # Run the REAL Groq API test
      # --------------------------------------------------------
      - name: Run Real Groq Integration Test
        if: steps.check-key.outputs.available == 'true'
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_groq_integration.py -v

      # --------------------------------------------------------
      # Clearly report when the test was skipped
      # --------------------------------------------------------
      - name: Integration Test Skipped
        if: steps.check-key.outputs.available != 'true'
        run: |
          echo "⚠️ GROQ_API_KEY is not configured."
          echo "⚠️ Real Groq Integration Test was skipped."
          echo "ℹ️ Add GROQ_API_KEY under:"
          echo "   GitHub → Settings → Secrets and variables → Actions"


  # ============================================================
  # SUMMARY
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - test
      - integration-test

    if: always()

    steps:
      - name: Show CI Result
        shell: bash
        run: |
          echo "========================================"
          echo "        ⚡ NovaCLI CI Summary"
          echo "========================================"
          echo ""
          echo "Unit Tests:       ${{ needs.test.result }}"
          echo "Groq Integration: ${{ needs.integration-test.result }}"
          echo ""

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Unit tests failed."
            exit 1
          fi

          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "❌ Groq integration job failed."
            exit 1
          fi

          echo "✅ All required CI jobs passed."
