name: NovaCLI CI

on:
  push:
    branches:
      - main
      - Novacli

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx build

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q

      - name: Verify Package Build and Install
        run: |
          python -m build
          pip install dist/novacli-*.whl
          python -c "import nova; import nova.ai; import nova.intelligence; print('Built wheel imported successfully!')"

  integration-test:
    name: Real Groq Integration Test
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Check Groq API Key
        id: check-key
        shell: bash
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "GROQ_API_KEY is not configured."
          fi

      - name: Run Real Groq Integration Test
        if: steps.check-key.outputs.available == 'true'
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_groq_integration.py -v

      - name: Integration Test Skipped
        if: steps.check-key.outputs.available != 'true'
        run: |
          echo "⚠️ GROQ_API_KEY is not configured."
          echo "⚠️ Real Groq Integration Test was skipped."

  ci-summary:
    name: CI Summary Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - integration-test

    if: always()

    steps:
      - name: Evaluate CI Gate Status
        shell: bash
        run: |
          echo "========================================"
          echo "        ⚡ NovaCLI CI Summary"
          echo "========================================"
          echo ""
          echo "Unit & Security Tests: ${{ needs.test.result }}"
          echo "Groq Integration:      ${{ needs.integration-test.result }}"
          echo ""
          python3 -c "
import sys
test_res = '${{ needs.test.result }}'
groq_res = '${{ needs.integration-test.result }}'
if test_res != 'success':
    print('❌ Required job test failed or was cancelled.')
    sys.exit(1)
if groq_res == 'failure':
    print('❌ integration-test failed.')
    sys.exit(1)
print('✅ All required CI checks passed.')
"
